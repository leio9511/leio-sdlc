name: Preflight

"on":
  push: {}
  pull_request: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python runtime
        id: python-runtime-setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node runtime
        id: node-runtime-setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bootstrap controlled Python dependencies
        id: minimal-bootstrap
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          bash scripts/dev_python.sh -m pip check

      - name: Run preflight
        id: run-preflight
        run: |
          bash preflight.sh --report-all

      - name: Run runtime smoke
        id: run-runtime-smoke
        run: |
          RUNTIME_SMOKE_ROOT="${RUNNER_TEMP}/leio-sdlc-runtime-smoke"
          rm -rf "${RUNTIME_SMOKE_ROOT}"
          mkdir -p "${RUNTIME_SMOKE_ROOT}"
          cp -a scripts "${RUNTIME_SMOKE_ROOT}/scripts"
          cp requirements.txt "${RUNTIME_SMOKE_ROOT}/requirements.txt"
          python -m venv "${RUNTIME_SMOKE_ROOT}/.venv"
          "${RUNTIME_SMOKE_ROOT}/.venv/bin/python" -m pip install --upgrade pip
          "${RUNTIME_SMOKE_ROOT}/.venv/bin/python" -m pip install -r "${RUNTIME_SMOKE_ROOT}/requirements.txt"
          bash "${RUNTIME_SMOKE_ROOT}/scripts/runtime_python.sh" "${RUNTIME_SMOKE_ROOT}/scripts/runtime_smoke.py"
