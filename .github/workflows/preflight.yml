name: Preflight

"on":
  push:
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python-runtime-setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: node-runtime-setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: minimal-bootstrap
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml

      - name: bash preflight.sh
        shell: bash
        run: bash preflight.sh
