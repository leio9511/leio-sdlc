name: Preflight

"on":
  push: {}
  pull_request: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python runtime
        id: python-runtime-setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node runtime
        id: node-runtime-setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Minimal bootstrap
        id: minimal-bootstrap
        run: |
          bash scripts/dev_python.sh -m pip check

      - name: Run preflight
        id: run-preflight
        run: |
          bash preflight.sh --report-all

      - name: Run runtime smoke
        id: run-runtime-smoke
        run: |
          bash scripts/dev_python.sh scripts/runtime_smoke.py --expected-runtime-python "${PWD}/.venv/bin/python"
